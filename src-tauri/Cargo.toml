[package]
name = "vontaqfs-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "VontaqFS desktop shell and local runtime host"

[lib]
name = "vontaqfs_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "=2.12.0"
tauri-plugin-dialog = "=2.7.3"
serde.workspace = true
serde_json.workspace = true
vontaqfs-runtime = { path = "../crates/runtime" }
vontaqfs-protocol = { path = "../crates/protocol" }
