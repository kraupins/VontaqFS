[workspace]
members = ["crates/core", "crates/protocol", "crates/runtime", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "LicenseRef-VontaqFS-Source-Available-1.0"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
rusqlite = { version = "0.39.0", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
icu_normalizer = "2.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
